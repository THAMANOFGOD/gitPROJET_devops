name: Build and Push Docker image

on:
  push:
    branches:
      - main  # le workflow s’exécute à chaque push sur la branche principale

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Récupérer le code du repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ (Optionnel) QEMU pour support multi-architecture
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3️⃣ Installer Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 4️⃣ Se connecter à Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5️⃣ Construire et pousser l’image
      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            thamanofgod/gitprojet_devops:latest
            thamanofgod/gitprojet_devops:${{ github.sha }}
